name: did
description: "D!D - Dive Into Development"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  animated_text_kit: ^4.3.0
  firebase_core: ^3.10.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.1

  shared_preferences: ^2.1.1
  file_picker: ^11.0.2
  url_launcher: ^6.3.0
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/didapplogo.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
